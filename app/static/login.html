<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ねこのてにログインします。">
    <title>ログイン · ねこのて</title>
    <link rel="icon" href="./static/github-avatar.png" type="image/png">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <div class="mark" aria-hidden="true"><img src="./static/github-avatar.png" alt=""></div>
        <div class="login-brand">ねこのて</div>
        <h1>ログイン</h1>
        <p>共有LANパスワードを入力してください。</p>
        <form action="/login" method="post">
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          <button type="submit">続ける</button>
        </form>
        <p id="login-error" class="login-error" role="alert" hidden>パスワードが正しくありません。</p>
      </section>
    </main>
  </body>
</html>
